<!DOCTYPE html>
<html>
<head>
    <title>PlayAble - Web Dashboard</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 40px; }
        h1 { font-size: 2rem; }
        img { border: 2px solid black; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 1rem; margin-top: 20px; cursor: pointer; }
        a.button-link {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #18c418;
            color: rgb(248, 6, 216);
            text-decoration: none;
            border-radius: 4px;
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <!-- Title -->
    <h1>🎯 PlayAble Control Dashboard</h1>
    
    <!-- Live Camera Feed -->
    <h2>📷 Live Camera Preview</h2>
    <img src="/video_feed" width="640" height="480" alt="Live camera feed">
    <br><br>

    <!-- Threshold Adjustment -->
    <h2>⚡ Threshold Settings</h2>
    
    <button onclick="adjustThreshold('delta_increase')">➕ Increase Δ Threshold</button>
    <button onclick="adjustThreshold('delta_decrease')">➖ Decrease Δ Threshold</button>
    <br><br>
    <button onclick="adjustThreshold('raise_increase')">⬆️ Increase Raise Minimum</button>
    <button onclick="adjustThreshold('raise_decrease')">⬇️ Decrease Raise Minimum</button>

    <br><br>

    <!-- Current Threshold Display -->
    <h3>Current Δ Threshold: <span id="delta-val">{{ current_delta }}</span></h3>
    <h3>Current Raise Minimum: <span id="raise-val">{{ current_raise }}</span></h3> 

    <br><hr><br>

    <!-- Navigation Links -->
    <a href="/controller" class="button-link">Controller Setup</a>
    <a href="/controller_status_page" class="button-link">🎮 Live Controller View</a>
    <a href="/controller_mapping" class="button-link">🖐️ Gesture Mapping</a>
    <a href="/ps5_setup" class="button-link">🕹️ PS5 Remote Setup</a>

    <script>
        function adjustThreshold(type) {
            fetch("/adjust_threshold", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: `type=${type}`
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("delta-val").textContent = data.new_delta.toFixed(3);
                document.getElementById("raise-val").textContent = data.new_raise.toFixed(3);
            })
            .catch(err => {
                alert("Failed to update threshold.");
                console.error(err);
            });
        }
    </script>

</body>
</html>
